<style>

  .fp-close { cursor:pointer; font-size:18px; line-height:1; color:#888; padding:0 4px; }

  .fp-mode-tabs { display:flex; gap:4px; margin-bottom:8px; }

  .fp-mode-tab.active { background:#2F4858; color:#fff; border-color:#2F4858; }
  .fp-select-all { border-bottom:1px solid #eee; padding-bottom:6px; margin-bottom:4px; font-weight:600; }

  th { background:#f8f9fb; position:sticky; top:0; z-index:2; user-select:none; padding:0; }

function escapeHtml(s) {
  if (s == null) return s;
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const LOTS_FILE_BY_CHANNEL = {sale: 'lots', rent: 'rent_lots', coworking: 'coworking'};
const CHANNEL_LABEL = {sale:'Продажа', rent:'Аренда', coworking:'Коворкинг', serviced_office:'Сервисный офис', other:'Другое/не установлено'};

// «Девелоперы квартала» — агрегат по зданиям ВЫБРАННОГО квартала (не по

  {key:'projects', label:'Проектов в квартале', type:'number', visible:true},
  {key:'buildings', label:'Зданий', type:'number', visible:true},

// ============================================================
//  СОСТОЯНИЕ ТАБЛИЦЫ (общий движок для всех вкладок)
// ============================================================
function makeTableState(columns) {
  return {
    columns: columns.map(c => ({...c})),
    rows: [],
    filters: {},        // key -> {mode:'values'|'search', values:Set, search:'', emptyOnly:false, nonEmptyOnly:false}
    sort: {key:null, dir:1},
    globalSearch: '',
    page: 1,
  };
}

let currentTab = 'codifier';
let currentChannel = 'sale';
let compareQuarterId = '';
const state = {
  codifier: makeTableState(CODIFIER_COLUMNS),
  buildings: makeTableState(BUILDINGS_COLUMNS),
  developers: makeTableState(DEVELOPERS_COLUMNS),
  lots: makeTableState(LOTS_SALE_COLUMNS),
};
let allProjectsLayer = [];
let currentQuarterId = QUARTERS[0].id;
let dataMeta = {codifier: null, buildings: null, developers: null, lots: null};
let pageSize = 100;
let suppressURLSync = false; // true пока восстанавливаем состояние из URL — не переписывать URL посреди восстановления

// ============================================================
//  ЗАГРУЗКА ДАННЫХ
// ============================================================
async function loadCodifier() {
  const rows = await fetchJSON('data/all_projects_layer.json');
  allProjectsLayer = rows;
  state.codifier.rows = rows;
  dataMeta.codifier = {updated: rows.length ? rows[0].last_verified_at : null, count: rows.length};
  render();
}

// Join к общему реестру по имени/исходному имени — без изменения production-файлов,
// сопоставление делается здесь, на чтении (см. открытый вопрос в ONLINE_TABLES_SPEC:
// join-поле в саму production-схему buildings_*.json не добавлено).
function registryByNameMap() {
  const byName = new Map();
  for (const r of allProjectsLayer) {
    if (r.canonical_name) byName.set(r.canonical_name, r);
    if (r.raw_name) byName.set(r.raw_name, r);
  }
  return byName;
}
function joinRegistryFields(row, byName, nameKey, nameOrigKey) {
  const match = byName.get(row[nameKey]) || (nameOrigKey ? byName.get(row[nameOrigKey]) : null);
  row.canonical_project_id = match ? match.canonical_project_id : null;
  row.reg_project_status = match ? match.project_status : null;
  row.reg_offer_status = match ? match.offer_status : null;
  row.reg_input_quarter = match ? match.input_quarter : null;
  row.reg_source = match ? match.source : null;
  row.reg_confidence = match ? match.confidence : null;
  row.reg_bizFormed = match ? match.bizFormed : null;
  row.reg_bizForming = match ? match.bizForming : null;
  row.reg_market_channel = match ? match.market_channel : null;
  return match;
}

async function fetchBuildingsWithJoin(quarterId) {
  const rows = await fetchJSON(`data/buildings_${quarterId}.json`);
  const byName = registryByNameMap();
  for (const row of rows) joinRegistryFields(row, byName, 'name', 'name_orig');
  return rows;
}

async function loadBuildings(quarterId) {
  const rows = await fetchBuildingsWithJoin(quarterId);
  state.buildings.rows = rows;
  if (!suppressURLSync) state.buildings.page = 1; // не сбрасывать страницу, если сейчас идёт восстановление вида из URL
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.buildings = {updated: label, count: rows.length};
  render();
}

// «Девелоперы квартала» — группировка ТОЛЬКО по проектам этого квартала
// (не по всему кодификатору), см. ONLINE_TABLES_SPEC раздел 3.
async function loadDevelopers(quarterId) {
  const buildings = await fetchBuildingsWithJoin(quarterId);
  const byDev = new Map();
  for (const b of buildings) {
    const dev = b.developer || '—';
    if (!byDev.has(dev)) {
      byDev.set(dev, {developer: dev, projectIds: new Set(), buildings: 0, gbaSum: 0, volumeSum: 0, lotsSum: 0, priceWeighted: 0, classes: new Set()});
    }
    const acc = byDev.get(dev);
    acc.projectIds.add(b.canonical_project_id || b.name);
    acc.buildings += 1;
    if (b.gba != null) acc.gbaSum += Number(b.gba);
    if (b.volume != null) acc.volumeSum += Number(b.volume);
    if (b.lots != null) acc.lotsSum += Number(b.lots);
    if (b.price != null && b.volume != null) acc.priceWeighted += Number(b.price) * Number(b.volume);
    if (b.cls) acc.classes.add(b.cls);
  }
  const rows = [...byDev.values()].map(acc => ({
    developer: acc.developer,
    projects: acc.projectIds.size,
    buildings: acc.buildings,
    gbaSum: acc.gbaSum || null,
    volumeSum: acc.volumeSum || null,
    lotsSum: acc.lotsSum || null,
    weightedPrice: acc.volumeSum ? Math.round(acc.priceWeighted / acc.volumeSum) : null,
    classes: [...acc.classes].sort().join(', '),
  }));
  state.developers.rows = rows;
  if (!suppressURLSync) state.developers.page = 1;
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.developers = {updated: label, count: rows.length};
  render();
}

async function loadLots(quarterId, channel) {
  const filePrefix = LOTS_FILE_BY_CHANNEL[channel];
  let rows;
  try {
    const raw = await fetchJSON(`data/${filePrefix}_${quarterId}.json`);
    if (channel === 'coworking') {
      // coworking_*.json уже плоский массив строк.
      rows = raw;
    } else {
      // lots_*.json / rent_lots_*.json — словарь {"Здание": [{...}, ...]}.
      rows = [];
      for (const [building, lotRows] of Object.entries(raw)) {
        for (const lot of lotRows) rows.push({building, ...lot});
      }
    }
  } catch (e) {
    // Не у каждого квартала есть все три файла (см. index.html: некоторые
    // старые кварталы без rent/coworking) — пустая таблица, не ошибка.
    rows = [];
  }
  const byName = registryByNameMap();
  const nameKey = channel === 'coworking' ? 'name' : 'building';
  for (const row of rows) {
    row.market_channel = CHANNEL_LABEL[channel]; // явное, взаимоисключающее поле — вся вкладка = один канал
    joinRegistryFields(row, byName, nameKey, null);
  }
  state.lots.columns = LOTS_COLUMNS_BY_CHANNEL[channel].map(c => ({...c}));
  state.lots.rows = rows;
  // Смена канала — разные схемы колонок, старые фильтры/сортировка почти
  // наверняка не имеют смысла. НЕ сбрасывать, если сейчас идёт восстановление
  // вида из URL (там колонки/фильтры для нужного канала уже применены выше).
  if (!suppressURLSync) {
    state.lots.filters = {};
    state.lots.sort = {key:null, dir:1};
    state.lots.page = 1;
  }
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.lots = {updated: `${label} · ${CHANNEL_LABEL[channel]}`, count: rows.length};
  render();
}

// ============================================================
//  ФИЛЬТРАЦИЯ / СОРТИРОВКА
// ============================================================
function cellValue(row, col) {
  let v = row[col.key];
  if (col.type === 'list' && Array.isArray(v)) return v.join(', ');
  if (col.type === 'bool') return v === true ? 'да' : (v === false ? 'нет' : '');
  return v;
}

function passesCondition(row, col, cond) {
  if (!cond || !cond.op) return true;
  const raw = cellValue(row, col);
  if (col.type === 'number') {
    if (raw == null || raw === '') return false;
    const n = Number(raw);
    if (cond.op === 'eq') return cond.value !== '' && n === Number(cond.value);
    if (cond.op === 'gt') return cond.value !== '' && n > Number(cond.value);
    if (cond.op === 'lt') return cond.value !== '' && n < Number(cond.value);
    if (cond.op === 'between') {
      const lo = cond.value === '' ? -Infinity : Number(cond.value);
      const hi = cond.value2 === '' ? Infinity : Number(cond.value2);
      return n >= lo && n <= hi;
    }
    return true;
  }
  // текстовые операторы
  const s = String(raw ?? '').toLowerCase();
  const needle = String(cond.value ?? '').toLowerCase();
  if (needle === '') return true;
  if (cond.op === 'eq') return s === needle;
  if (cond.op === 'contains') return s.includes(needle);
  if (cond.op === 'startswith') return s.startsWith(needle);
  return true;
}

function passesFilter(row, col, filter) {
  if (!filter) return true;
  const raw = row[col.key];
  const isEmpty = raw == null || raw === '' || (Array.isArray(raw) && raw.length === 0);
  if (filter.emptyOnly) return isEmpty;
  if (filter.nonEmptyOnly) return !isEmpty;
  if (filter.mode === 'condition' && filter.condition) {
    return passesCondition(row, col, filter.condition);
  }
  if (filter.values && filter.values.size > 0) {
    // Для колонок-списков (market_channel и т.п.) — "содержит хотя бы одно
    // выбранное значение", а не сравнение со всей склеенной строкой целиком
    // (иначе "sale, rent" никогда не совпадёт с выбранным "sale").
    if (col.type === 'list' && Array.isArray(raw)) {
      return raw.some(v => filter.values.has(String(v)));
    }
    const v = String(cellValue(row, col) ?? '');
    return filter.values.has(v);
  }
  return true;
}

function getFilteredSortedRows(ts) {
  let rows = ts.rows.filter(row => {
    for (const col of ts.columns) {
      const f = ts.filters[col.key];
      if (f && !passesFilter(row, col, f)) return false;
    }
    if (ts.globalSearch) {
      const q = ts.globalSearch.toLowerCase();
      const hit = ts.columns.some(col => {
        if (!col.visible) return false;
        const v = cellValue(row, col);
        return v != null && String(v).toLowerCase().includes(q);
      });
      if (!hit) return false;
    }
    return true;
  });
  if (ts.sort.key) {
    const col = ts.columns.find(c => c.key === ts.sort.key);
    rows = rows.slice().sort((a, b) => {
      let av = cellValue(a, col), bv = cellValue(b, col);
      if (col.type === 'number') {
        av = av == null ? -Infinity : Number(av);
        bv = bv == null ? -Infinity : Number(bv);
        return (av - bv) * ts.sort.dir;
      }
      av = (av ?? '').toString().toLowerCase();
      bv = (bv ?? '').toString().toLowerCase();
      return av.localeCompare(bv, 'ru') * ts.sort.dir;
    });
  }
  return rows;
}

// ============================================================
//  РЕНДЕР
// ============================================================
// Итоги считаются по ПОЛНОЙ отфильтрованной выборке (не по текущей странице
// пагинации). Пустые значения не превращаются в 0 — суммируются только
// реально присутствующие числа, а количество непустых указывается отдельно,
// если оно меньше числа строк.
function fmtNum(n) {
  if (n == null || !isFinite(n)) return '—';
  return Math.round(n).toLocaleString('ru-RU');
}
function sumField(rows, key) {
  let sum = 0, n = 0;
  for (const r of rows) { const v = r[key]; if (v != null && isFinite(v)) { sum += Number(v); n++; } }
  return {sum, n};
}
function uniqueCount(rows, keyFn) {
  return new Set(rows.map(keyFn).filter(v => v != null)).size;
}

function computeTotals(tab, rows) {
  if (tab === 'codifier') {
    const projects = uniqueCount(rows, r => r.canonical_project_id);
    const gba = sumField(rows, 'gba');
    const gla = sumField(rows, 'gla');
    return `Уникальных проектов: ${fmtNum(projects)} · Записей: ${rows.length} · `
      + `GBA (сумма по ${gba.n} из ${rows.length}): ${fmtNum(gba.sum)} · GLA (${gla.n} из ${rows.length}): ${fmtNum(gla.sum)}`;
  }
  if (tab === 'buildings') {
    const projects = uniqueCount(rows, r => r.canonical_project_id || r.name);
    const gba = sumField(rows, 'gba');
    const volume = sumField(rows, 'volume');
    const lots = sumField(rows, 'lots');
    const priceRows = rows.filter(r => r.price != null && r.volume != null);
    const weighted = priceRows.length ? priceRows.reduce((s,r)=>s+r.price*r.volume,0) / priceRows.reduce((s,r)=>s+r.volume,0) : null;
    return `Уникальных проектов: ${fmtNum(projects)} · Зданий: ${rows.length} · Лотов (сумма): ${fmtNum(lots.sum)} · `
      + `GBA: ${fmtNum(gba.sum)} · Объём на продажу: ${fmtNum(volume.sum)} · Ср.взв. цена: ${fmtNum(weighted)}`;
  }
  if (tab === 'developers') {
    const gba = sumField(rows, 'gbaSum');
    const volume = sumField(rows, 'volumeSum');
    const lots = sumField(rows, 'lotsSum');
    return `Девелоперов: ${rows.length} · GBA (сумма): ${fmtNum(gba.sum)} · Объём (сумма): ${fmtNum(volume.sum)} · Лотов (сумма): ${fmtNum(lots.sum)}`;
  }
  if (tab === 'lots') {
    const buildings = uniqueCount(rows, r => r.building || r.name);
    if (currentChannel === 'sale') {
      const area = sumField(rows, 'area');
      const total = sumField(rows, 'total');
      const weighted = total.sum && area.sum ? total.sum / area.sum : null;
      return `Лотов: ${rows.length} · Зданий (уникальных): ${buildings} · Площадь (сумма): ${fmtNum(area.sum)} · `
        + `Стоимость (сумма): ${fmtNum(total.sum)} · Ср.взв. цена: ${fmtNum(weighted)}`;
    }
    if (currentChannel === 'rent') {
      const area = sumField(rows, 'area');
      const rateRows = rows.filter(r => r.rate != null && r.area != null);
      const weighted = rateRows.length ? rateRows.reduce((s,r)=>s+r.rate*r.area,0) / rateRows.reduce((s,r)=>s+r.area,0) : null;
      return `Лотов: ${rows.length} · Зданий (уникальных): ${buildings} · Площадь (сумма): ${fmtNum(area.sum)} · Ср.взв. ставка: ${fmtNum(weighted)}`;
    }
    // coworking
    const seats = sumField(rows, 'seats');
    const vacancy = sumField(rows, 'vacancy');
    return `Площадок: ${rows.length} · Мест (сумма): ${fmtNum(seats.sum)} · Вакантно (сумма): ${fmtNum(vacancy.sum)}`;
  }
  return '';
}

function render() {
  const ts = state[currentTab];
  const filteredRows = getFilteredSortedRows(ts);
  const cols = ts.columns.filter(c => c.visible);

  const totalPages = Math.max(1, Math.ceil(filteredRows.length / pageSize));
  ts.page = Math.min(Math.max(1, ts.page || 1), totalPages);
  const pageRows = filteredRows.slice((ts.page - 1) * pageSize, ts.page * pageSize);

  const thead = document.querySelector('#mainTable thead');
  thead.innerHTML = '<tr>' + cols.map(col => {
    const isSorted = ts.sort.key === col.key;
    const sortInd = isSorted ? `<span class="sort-ind">${ts.sort.dir === 1 ? '▲' : '▼'}</span>` : '';
    const f = ts.filters[col.key];
    const hasFilter = !!(f && ((f.values && f.values.size > 0) || f.emptyOnly || f.nonEmptyOnly || (f.mode === 'condition' && f.condition && f.condition.op)));
    return `<th data-key="${col.key}"><div class="th-inner">`
      + `<span class="th-label" data-sort-key="${col.key}" title="Сортировать">${escapeHtml(col.label)}${sortInd}</span>`
      + `<button type="button" class="filter-btn${hasFilter ? ' active' : ''}" data-filter-key="${col.key}" `
      + `aria-label="Фильтр по столбцу «${escapeHtml(col.label)}»"${hasFilter ? ' aria-pressed="true"' : ''} title="Фильтр">▾</button>`
      + `</div></th>`;
  }).join('') + '</tr>';

  const tbody = document.querySelector('#mainTable tbody');
  if (pageRows.length === 0) {
    const colspan = Math.max(1, cols.length);
    tbody.innerHTML = `<tr class="no-results-row"><td colspan="${colspan}">`
      + (filteredRows.length === 0 && ts.rows.length > 0
          ? 'Нет строк, удовлетворяющих текущим фильтрам.'
          : (ts.rows.length === 0 ? 'Нет данных для этого среза.' : 'Пустая страница.'))
      + (filteredRows.length === 0 && ts.rows.length > 0 ? ' <button type="button" class="btn" id="btnResetInline">Сбросить фильтры</button>' : '')
      + `</td></tr>`;
  } else {
    tbody.innerHTML = pageRows.map(row => {
      const rowClass = row.qa_status === 'conflict' ? 'qa-conflict' : (row.qa_status === 'quarantine' ? 'qa-quarantine' : '');
      return `<tr class="${rowClass}">` + cols.map(col => {
        const v = cellValue(row, col);
        const display = (v == null || v === '') ? '<span class="empty-cell">—</span>' : escapeHtml(String(v));
        return `<td>${display}</td>`;
      }).join('') + '</tr>';
    }).join('');
  }
  const resetInline = document.getElementById('btnResetInline');
  if (resetInline) resetInline.onclick = () => document.getElementById('btnReset').click();

  const meta = dataMeta[currentTab];
  document.getElementById('statusRow').textContent =
    `Строк: ${filteredRows.length} из ${ts.rows.length}` +
    (meta ? ` · срез: ${meta.updated ?? '—'}` : '');
  document.getElementById('totalsRow').textContent = 'Итого по выборке: ' + computeTotals(currentTab, filteredRows);
  document.getElementById('pagerLabel').textContent = `Стр. ${ts.page} из ${totalPages}`;
  document.getElementById('btnPrevPage').disabled = ts.page <= 1;
  document.getElementById('btnNextPage').disabled = ts.page >= totalPages;
  document.getElementById('metaLine').textContent =
    currentTab === 'codifier' ? 'data/all_projects_layer.json' :
    currentTab === 'buildings' ? `data/buildings_${currentQuarterId}.json (+ join по реестру)` :
    currentTab === 'developers' ? `data/buildings_${currentQuarterId}.json (агрегат по девелоперам)` :
    `data/${LOTS_FILE_BY_CHANNEL[currentChannel]}_${currentQuarterId}.json`;

  attachHeaderHandlers();
  if (!suppressURLSync) syncURL();
}

function attachHeaderHandlers() {
  // Сортировка и фильтрация — два РАЗНЫХ элемента (.th-label / button.filter-btn),
  // не одна и та же зона клика, разделённая координатой.
  document.querySelectorAll('#mainTable .th-label').forEach(label => {
    label.onclick = () => {
      const key = label.dataset.sortKey;
      const ts = state[currentTab];
      if (ts.sort.key === key) ts.sort.dir *= -1;
      else { ts.sort.key = key; ts.sort.dir = 1; }
      render();
    };
  });
  document.querySelectorAll('#mainTable .filter-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const key = btn.dataset.filterKey;
      const ts = state[currentTab];
      const col = ts.columns.find(c => c.key === key);
      openFilterPanel(btn, col);
    };
  });
}

// ============================================================
//  ПАНЕЛЬ ФИЛЬТРА ПО КОЛОНКЕ
// ============================================================
function closePanels() {
  document.querySelectorAll('.filter-panel, .cols-panel').forEach(p => p.remove());
}

function openFilterPanel(anchorEl, col) {
  closePanels();
  const ts = state[currentTab];
  const values = new Map(); // string value -> count
  ts.rows.forEach(row => {
    const raw = row[col.key];
    if (col.type === 'list' && Array.isArray(raw)) {
      // Отдельная опция на каждый элемент списка, а не на всю склеенную строку.
      raw.forEach(item => {
        const key = String(item ?? '');
        if (key === '') return;
        values.set(key, (values.get(key) || 0) + 1);
      });
      return;
    }
    const v = cellValue(row, col);
    const key = (v == null || v === '') ? '' : String(v);
    if (key === '') return;
    values.set(key, (values.get(key) || 0) + 1);
  });
  const sortedValues = [...values.keys()].sort((a,b) => a.localeCompare(b, 'ru', {numeric:true}));

  // Снимок фильтра ДО открытия — используется и для инициализации полей, и
  // чтобы "Отмена"/клик вне панели гарантированно вернули именно это состояние
  // (панель работает с черновиком в DOM, ts.filters не трогается до "Применить").
  const original = ts.filters[col.key]
    ? {
        mode: ts.filters[col.key].mode || 'values',
        values: new Set(ts.filters[col.key].values || []),
        emptyOnly: !!ts.filters[col.key].emptyOnly,
        nonEmptyOnly: !!ts.filters[col.key].nonEmptyOnly,
        condition: ts.filters[col.key].condition ? {...ts.filters[col.key].condition} : {op:'', value:'', value2:''},
      }
    : {mode:'values', values:new Set(), emptyOnly:false, nonEmptyOnly:false, condition:{op:'', value:'', value2:''}};

  const isNumber = col.type === 'number';
  const opOptions = isNumber
    ? `<option value="eq">Равно</option><option value="gt">Больше</option><option value="lt">Меньше</option><option value="between">Диапазон</option>`
    : `<option value="contains">Содержит</option><option value="eq">Равно</option><option value="startswith">Начинается с</option>`;

  const panel = document.createElement('div');
  panel.className = 'filter-panel';
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-label', `Фильтр: ${col.label}`);

  panel.innerHTML = `
    <div class="fp-header">
      <span class="fp-title">${escapeHtml(col.label)}</span>
      <span class="fp-close" id="fpClose" title="Закрыть (отмена)">×</span>
    </div>
    <div class="fp-mode-tabs">
      <div class="fp-mode-tab" id="fpTabValues" data-mode="values">Значения</div>
      <div class="fp-mode-tab" id="fpTabCondition" data-mode="condition">Условие</div>
    </div>
    <div id="fpValuesMode">
      <input type="text" placeholder="Поиск по значениям..." id="fpSearch">
      <label class="fp-select-all"><input type="checkbox" id="fpSelectAll"> Выбрать всё</label>
      <label><input type="checkbox" id="fpEmpty"> Пустые</label>
      <label><input type="checkbox" id="fpNonEmpty"> Непустые</label>
      <div id="fpValues"></div>
    </div>
    <div id="fpConditionMode" style="display:none;">
      <select id="fpCondOp">${opOptions}</select>
      <div class="fp-condition-row">
        <input type="${isNumber ? 'number' : 'text'}" id="fpCondValue" placeholder="${isNumber ? 'Значение' : 'Текст'}">
        <input type="number" id="fpCondValue2" placeholder="До" style="display:none;">
      </div>
    </div>
    <div class="fp-actions">
      <button class="btn primary" id="fpApply">Применить</button>
      <button class="btn" id="fpClear">Сбросить</button>
      <button class="btn" id="fpCancel">Отмена</button>
    </div>
  `;
  document.body.appendChild(panel);

  // --- позиционирование: сначала под кнопкой, затем зажать в границы окна ---
  function positionPanel() {
    const rect = anchorEl.getBoundingClientRect();
    const pw = panel.offsetWidth, ph = panel.offsetHeight;
    let top = rect.bottom + 4;
    let left = rect.right - pw; // по умолчанию выровнять по правому краю кнопки
    if (left < 8) left = 8;
    if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
    if (top + ph > window.innerHeight - 8) {
      // не помещается снизу — открыть вверх от кнопки
      top = rect.top - ph - 4;
      if (top < 8) top = 8;
    }
    panel.style.top = top + 'px';
    panel.style.left = left + 'px';
  }
  positionPanel();

  // --- режим (Значения / Условие) ---
  function setMode(mode) {
    panel.querySelector('#fpTabValues').classList.toggle('active', mode === 'values');
    panel.querySelector('#fpTabCondition').classList.toggle('active', mode === 'condition');
    panel.querySelector('#fpValuesMode').style.display = mode === 'values' ? '' : 'none';
    panel.querySelector('#fpConditionMode').style.display = mode === 'condition' ? '' : 'none';
    panel.dataset.mode = mode;
    positionPanel();
  }
  panel.querySelector('#fpTabValues').onclick = () => setMode('values');
  panel.querySelector('#fpTabCondition').onclick = () => setMode('condition');

  // --- вкладка "Значения" ---
  panel.querySelector('#fpEmpty').checked = original.emptyOnly;
  panel.querySelector('#fpNonEmpty').checked = original.nonEmptyOnly;
  panel.querySelector('#fpEmpty').onchange = (e) => { if (e.target.checked) panel.querySelector('#fpNonEmpty').checked = false; };
  panel.querySelector('#fpNonEmpty').onchange = (e) => { if (e.target.checked) panel.querySelector('#fpEmpty').checked = false; };

  function renderValueList(filterText) {
    const box = panel.querySelector('#fpValues');
    const list = sortedValues.filter(v => !filterText || v.toLowerCase().includes(filterText.toLowerCase()));
    box.innerHTML = list.map(v => `<label><input type="checkbox" class="fpVal" value="${escapeHtml(v)}" ${original.values.has(v)?'checked':''}> ${escapeHtml(v)} (${values.get(v)})</label>`).join('');
    syncSelectAll();
  }
  function syncSelectAll() {
    const boxes = [...panel.querySelectorAll('.fpVal')];
    panel.querySelector('#fpSelectAll').checked = boxes.length > 0 && boxes.every(b => b.checked);
  }
  renderValueList('');
  panel.querySelector('#fpSearch').oninput = (e) => renderValueList(e.target.value);
  panel.querySelector('#fpSelectAll').onchange = (e) => {
    panel.querySelectorAll('.fpVal').forEach(b => { b.checked = e.target.checked; });
  };
  panel.querySelector('#fpValues').addEventListener('change', (e) => {
    if (e.target.classList.contains('fpVal')) syncSelectAll();
  });

  // --- вкладка "Условие" ---
  panel.querySelector('#fpCondOp').value = original.condition.op || (isNumber ? 'eq' : 'contains');
  panel.querySelector('#fpCondValue').value = original.condition.value ?? '';
  panel.querySelector('#fpCondValue2').value = original.condition.value2 ?? '';
  panel.querySelector('#fpCondValue').placeholder = (isNumber && panel.querySelector('#fpCondOp').value === 'between') ? 'От' : (isNumber ? 'Значение' : 'Текст');
  panel.querySelector('#fpCondValue2').style.display = (isNumber && panel.querySelector('#fpCondOp').value === 'between') ? '' : 'none';
  panel.querySelector('#fpCondOp').onchange = (e) => {
    const isBetween = isNumber && e.target.value === 'between';
    panel.querySelector('#fpCondValue2').style.display = isBetween ? '' : 'none';
    panel.querySelector('#fpCondValue').placeholder = isBetween ? 'От' : (isNumber ? 'Значение' : 'Текст');
  };

  setMode(original.mode === 'condition' ? 'condition' : 'values');

  // --- действия ---
  panel.querySelector('#fpApply').onclick = () => {
    const mode = panel.dataset.mode;
    const emptyOnly = panel.querySelector('#fpEmpty').checked;
    const nonEmptyOnly = panel.querySelector('#fpNonEmpty').checked;
    if (emptyOnly || nonEmptyOnly) {
      ts.filters[col.key] = {mode:'values', values:new Set(), emptyOnly, nonEmptyOnly};
    } else if (mode === 'condition') {
      const condition = {
        op: panel.querySelector('#fpCondOp').value,
        value: panel.querySelector('#fpCondValue').value,
        value2: panel.querySelector('#fpCondValue2').value,
      };
      if (condition.value === '' && condition.value2 === '') {
        delete ts.filters[col.key];
      } else {
        ts.filters[col.key] = {mode:'condition', values:new Set(), emptyOnly:false, nonEmptyOnly:false, condition};
      }
    } else {
      const checked = [...panel.querySelectorAll('.fpVal:checked')].map(el => el.value);
      if (checked.length === 0) {
        delete ts.filters[col.key];
      } else {
        ts.filters[col.key] = {mode:'values', values:new Set(checked), emptyOnly:false, nonEmptyOnly:false};
      }
    }
    closePanels();
    render();
  };
  panel.querySelector('#fpClear').onclick = () => {
    delete ts.filters[col.key];
    closePanels();
    render();
  };
  function cancel() {
    // Черновик в DOM просто выбрасывается — ts.filters не менялся, поэтому
    // "отмена" = закрыть без вызова render() с уже неизменным состоянием.
    closePanels();
  }
  panel.querySelector('#fpCancel').onclick = cancel;
  panel.querySelector('#fpClose').onclick = cancel;

  setTimeout(() => {
    document.addEventListener('click', function onDocClick(ev) {
      if (!panel.contains(ev.target) && ev.target !== anchorEl) {
        cancel();
        document.removeEventListener('click', onDocClick);
      }
    });
    document.addEventListener('keydown', function onEsc(ev) {
      if (ev.key === 'Escape') {
        cancel();
        document.removeEventListener('keydown', onEsc);
      }
    });
  }, 0);
}

// ============================================================
//  ПАНЕЛЬ ВЫБОРА КОЛОНОК
// ============================================================
document.getElementById('btnColumns').onclick = (e) => {
  closePanels();
  const ts = state[currentTab];
  const panel = document.createElement('div');
  panel.className = 'cols-panel';
  panel.innerHTML = ts.columns.map(col =>
    `<label><input type="checkbox" class="colVis" data-key="${col.key}" ${col.visible?'checked':''}> ${escapeHtml(col.label)}</label>`
  ).join('');
  document.body.appendChild(panel);
  // position:fixed — координаты окна, зажать в границы (та же логика, что у filter-panel).
  const rect = e.target.getBoundingClientRect();
  let left = rect.left, top = rect.bottom + 4;
  if (left + panel.offsetWidth > window.innerWidth - 8) left = window.innerWidth - panel.offsetWidth - 8;
  if (top + panel.offsetHeight > window.innerHeight - 8) top = Math.max(8, rect.top - panel.offsetHeight - 4);
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
  panel.querySelectorAll('.colVis').forEach(cb => {
    cb.onchange = () => {
      const col = ts.columns.find(c => c.key === cb.dataset.key);
      col.visible = cb.checked;
      render();
    };
  });
  setTimeout(() => {
    document.addEventListener('click', function onDocClick(ev) {
      if (!panel.contains(ev.target) && ev.target !== e.target) {
        closePanels();
        document.removeEventListener('click', onDocClick);
      }
    });
  }, 0);
};

document.getElementById('btnReset').onclick = () => {
  const ts = state[currentTab];

function currentExportRows() {
  const ts = state[currentTab];
  const cols = ts.columns.filter(c => c.visible);
  const rows = getFilteredSortedRows(ts);
  return {cols, rows};
}

document.getElementById('btnExportCsv').onclick = () => {
  const {cols, rows} = currentExportRows();
  const header = cols.map(c => c.label).join(';');
  const lines = rows.map(row => cols.map(col => {
    const v = cellValue(row, col);
    return '"' + String(v ?? '').replace(/"/g, '""') + '"';
  }).join(';'));
  const csv = '﻿' + [header, ...lines].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const suffix = currentTab === 'codifier' ? 'all' : (currentTab === 'lots' ? `${currentQuarterId}_${currentChannel}` : currentQuarterId);
  a.download = `${currentTab}_${suffix}.csv`;
  a.click();
};

document.getElementById('btnExportXlsx').onclick = () => {
  const {cols, rows} = currentExportRows();
  const aoa = [cols.map(c => c.label)].concat(rows.map(row => cols.map(col => cellValue(row, col) ?? '')));
  const wb = XLSX.utils.book_new();
  const sheetName = {codifier:'Кодификатор', buildings:'Здания квартала', developers:'Девелоперы квартала', lots:'Все лоты'}[currentTab];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), sheetName);
  const suffix = currentTab === 'codifier' ? 'all' : (currentTab === 'lots' ? `${currentQuarterId}_${currentChannel}` : currentQuarterId);
  XLSX.writeFile(wb, `${currentTab}_${suffix}.xlsx`);
};

// ============================================================

// ============================================================
document.getElementById('btnPrevPage').onclick = () => { state[currentTab].page -= 1; render(); };
document.getElementById('btnNextPage').onclick = () => { state[currentTab].page += 1; render(); };

// ============================================================
document.getElementById('presetSelect').onchange = (e) => {
  const preset = e.target.value;
  e.target.value = '';
  if (!preset) return;
  const ts = state[currentTab];
  ts.filters = {};
  if (preset === 'all_sale') {
    if (currentTab === 'lots') { channelSelect.value = 'sale'; currentChannel = 'sale'; loadLots(currentQuarterId, 'sale'); return; }
    const key = currentTab === 'codifier' ? 'market_channel' : 'reg_market_channel';
    ts.filters[key] = {values: new Set(['sale']), emptyOnly:false, nonEmptyOnly:false};
  } else if (preset === 'under_construction') {
    const key = currentTab === 'codifier' ? 'project_status' : 'reg_project_status';
    ts.filters[key] = {values: new Set(['Строится']), emptyOnly:false, nonEmptyOnly:false};
  } else if (preset === 'delivered') {
    const key = currentTab === 'codifier' ? 'project_status' : 'reg_project_status';
    ts.filters[key] = {values: new Set(['Введён']), emptyOnly:false, nonEmptyOnly:false};
  } else if (preset === 'no_source') {
    const key = currentTab === 'codifier' ? 'source' : 'reg_source';
    ts.filters[key] = {values: new Set(), emptyOnly:true, nonEmptyOnly:false};
  } else if (preset === 'changed_only') {
    // "Только изменения" — требует сравнения кварталов; включаем режим
    // сравнения (если ещё не включён) и фильтруем по наличию дельты объёма.
    if (currentTab === 'buildings') {
      if (!compareQuarterId) {
        alert('Выберите квартал для сравнения (селектор «Без сравнения»), чтобы увидеть только изменившиеся здания.');
        return;
      }
      ts.filters['delta_volume'] = {values: new Set(), emptyOnly:false, nonEmptyOnly:true};
    } else {
      alert('«Только изменения» пока реализовано только для вкладки «Здания квартала» (нужен режим сравнения кварталов).');
      return;
    }
  }
  render();
};

// ============================================================
//  СРАВНЕНИЕ ДВУХ КВАРТАЛОВ (только вкладка «Здания квартала»)
// ============================================================
const COMPARE_EXTRA_COLUMNS = [
  {key:'cmp_volume', label:'Объём (сравн. квартал)', type:'number', visible:true},
  {key:'delta_volume', label:'Δ объём', type:'number', visible:true},
  {key:'cmp_price', label:'Цена (сравн. квартал)', type:'number', visible:false},
  {key:'delta_price_pct', label:'Δ цена, %', type:'number', visible:true},
];

function removeCompareColumns() {
  state.buildings.columns = state.buildings.columns.filter(c => !c.key.startsWith('cmp_') && !c.key.startsWith('delta_'));
}

async function applyCompare(quarterId, compareId) {
  removeCompareColumns();
  if (!compareId) { render(); return; }
  let compareRows;
  try { compareRows = await fetchBuildingsWithJoin(compareId); }
  catch (e) { compareRows = []; }
  const byKey = new Map(compareRows.map(r => [r.canonical_project_id || r.name, r]));
  for (const row of state.buildings.rows) {
    const cmp = byKey.get(row.canonical_project_id || row.name);
    row.cmp_volume = cmp ? cmp.volume ?? null : null;
    row.cmp_price = cmp ? cmp.price ?? null : null;
    row.delta_volume = (row.volume != null && row.cmp_volume != null) ? (row.volume - row.cmp_volume) : null;
    row.delta_price_pct = (row.price != null && row.cmp_price) ? Math.round(((row.price - row.cmp_price) / row.cmp_price) * 1000) / 10 : null;
  }
  state.buildings.columns.push(...COMPARE_EXTRA_COLUMNS.map(c => ({...c})));
  render();
}

const compareSelect = document.getElementById('compareSelect');
compareSelect.innerHTML += QUARTERS.map(q => `<option value="${q.id}">${q.label}</option>`).join('');
compareSelect.onchange = (e) => {
  compareQuarterId = e.target.value;
  applyCompare(currentQuarterId, compareQuarterId);
};

// ============================================================
//  СОСТОЯНИЕ В URL (квартал/канал/сравнение/фильтры/сортировка/колонки)
// ============================================================
function syncURL() {
  const ts = state[currentTab];
  const p = new URLSearchParams();
  p.set('tab', currentTab);
  if (currentTab === 'buildings' || currentTab === 'developers' || currentTab === 'lots') p.set('q', currentQuarterId);
  if (currentTab === 'lots') p.set('channel', currentChannel);
  if (currentTab === 'buildings' && compareQuarterId) p.set('cmp', compareQuarterId);
  if (ts.globalSearch) p.set('search', ts.globalSearch);
  if (ts.sort.key) { p.set('sortKey', ts.sort.key); p.set('sortDir', String(ts.sort.dir)); }
  p.set('page', String(ts.page || 1));
  p.set('pageSize', String(pageSize));
  const hiddenCols = ts.columns.filter(c => !c.visible).map(c => c.key);
  if (hiddenCols.length) p.set('hide', hiddenCols.join(','));
  const filterKeys = Object.keys(ts.filters);
  if (filterKeys.length) {
    const encoded = filterKeys.map(k => {
      const f = ts.filters[k];
      const parts = [];
      if (f.emptyOnly) parts.push('EMPTY');
      else if (f.nonEmptyOnly) parts.push('NONEMPTY');
      else if (f.mode === 'condition' && f.condition && f.condition.op) {
        parts.push('COND=' + JSON.stringify({op: f.condition.op, value: f.condition.value, value2: f.condition.value2}));
      } else if (f.values && f.values.size) parts.push(...[...f.values]);
      return `${k}:${parts.map(encodeURIComponent).join('|')}`;
    });
    p.set('filters', encoded.join(';'));
  }
  history.replaceState(null, '', '?' + p.toString());
}

function restoreFromURL() {
  const p = new URLSearchParams(location.search);
  if (![...p.keys()].length) return;
  suppressURLSync = true;
  const tab = p.get('tab');
  if (tab && state[tab]) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  }
  const q = p.get('q');
  if (q && QUARTERS.some(x => x.id === q)) currentQuarterId = q;
  const channel = p.get('channel');
  if (channel && LOTS_COLUMNS_BY_CHANNEL[channel]) currentChannel = channel;
  const cmp = p.get('cmp');
  if (cmp && QUARTERS.some(x => x.id === cmp)) compareQuarterId = cmp;
  const pageSizeParam = Number(p.get('pageSize'));
  if (pageSizeParam) pageSize = pageSizeParam;

  const ts = state[currentTab];
  const search = p.get('search');
  if (search) ts.globalSearch = search;
  const sortKey = p.get('sortKey');
  if (sortKey) ts.sort = {key: sortKey, dir: Number(p.get('sortDir')) || 1};
  const page = Number(p.get('page'));
  if (page) ts.page = page;
  const hide = p.get('hide');
  if (hide) {
    const hideSet = new Set(hide.split(','));
    ts.columns.forEach(c => { if (hideSet.has(c.key)) c.visible = false; });
  }
  const filtersParam = p.get('filters');
  if (filtersParam) {
    for (const part of filtersParam.split(';')) {
      const [key, valuesStr] = part.split(':');
      if (!key) continue;
      const parts = (valuesStr || '').split('|').filter(Boolean).map(decodeURIComponent);
      const f = {mode:'values', values: new Set(), emptyOnly:false, nonEmptyOnly:false, condition:{op:'', value:'', value2:''}};
      for (const v of parts) {
        if (v === 'EMPTY') f.emptyOnly = true;
        else if (v === 'NONEMPTY') f.nonEmptyOnly = true;
        else if (v.startsWith('COND=')) {
          try {
            const cond = JSON.parse(v.slice('COND='.length));
            f.mode = 'condition';
            f.condition = {op: cond.op || '', value: cond.value ?? '', value2: cond.value2 ?? ''};
          } catch (e) { /* некорректная ссылка — игнорируем это условие */ }
        }
        else f.values.add(v);
      }
      ts.filters[key] = f;
    }
  }
  // suppressURLSync остаётся true до конца первоначальной загрузки данных —
  // см. init(): иначе loadBuildings/loadDevelopers/loadLots сбросят только что
  // восстановленные страницу/фильтры/сортировку как будто это обычная смена квартала.
}

document.getElementById('btnCopyLink').onclick = () => {
  syncURL();
  navigator.clipboard.writeText(location.href).then(() => {
    const btn = document.getElementById('btnCopyLink');
    const original = btn.textContent;
    btn.textContent = 'Скопировано!';
    setTimeout(() => { btn.textContent = original; }, 1200);
  }).catch(() => {
    alert('Не удалось скопировать автоматически. Ссылка: ' + location.href);
  });
};

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    switchToCurrentTab();
  };
});

function switchToCurrentTab() {
  document.getElementById('quarterSelect').style.display = (currentTab === 'buildings' || currentTab === 'developers' || currentTab === 'lots') ? '' : 'none';
  document.getElementById('compareSelect').style.display = currentTab === 'buildings' ? '' : 'none';
  document.getElementById('channelSelect').style.display = currentTab === 'lots' ? '' : 'none';
  document.getElementById('globalSearch').value = state[currentTab].globalSearch || '';
  quarterSelect.value = currentQuarterId;
  channelSelect.value = currentChannel;
  compareSelect.value = compareQuarterId;
  closePanels();
  if (currentTab === 'lots') {
    return loadLots(currentQuarterId, currentChannel);
  } else if (currentTab === 'developers') {
    return loadDevelopers(currentQuarterId);
  } else if (currentTab === 'buildings') {
    return loadBuildings(currentQuarterId).then(() => { if (compareQuarterId) return applyCompare(currentQuarterId, compareQuarterId); });
  } else {
    render();
    return Promise.resolve();
  }
}

const quarterSelect = document.getElementById('quarterSelect');
quarterSelect.innerHTML = QUARTERS.map(q => `<option value="${q.id}">${q.label}</option>`).join('');
quarterSelect.onchange = (e) => {
  currentQuarterId = e.target.value;
  if (currentTab === 'lots') loadLots(currentQuarterId, currentChannel);
  else if (currentTab === 'developers') loadDevelopers(currentQuarterId);
  else loadBuildings(currentQuarterId).then(() => { if (compareQuarterId) applyCompare(currentQuarterId, compareQuarterId); });
};

const channelSelect = document.getElementById('channelSelect');
channelSelect.onchange = (e) => {
  currentChannel = e.target.value;
  loadLots(currentQuarterId, currentChannel);
};

// ============================================================
//  ИНИЦИАЛИЗАЦИЯ
// ============================================================
(async function init() {
  restoreFromURL();
  document.getElementById('pageSizeSelect').value = String(pageSize);
  await loadCodifier();
  if (currentTab === 'codifier') {
    render();
  } else {
    await switchToCurrentTab();
  }
  suppressURLSync = false;
  syncURL();
})();
</script>
