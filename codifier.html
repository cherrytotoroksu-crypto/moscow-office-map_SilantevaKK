<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Кодификатор — Офисный рынок Москвы</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size:13px; color:#1a1a1a; background:#f4f5f7; }
  header { background:#2F4858; color:#fff; padding:10px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:15px; font-weight:600; }
  header .meta { font-size:11px; color:#c9d3d8; }
  .tabs { display:flex; gap:2px; padding:0 16px; background:#e8eaee; }
  .tab { padding:8px 16px; cursor:pointer; font-weight:500; color:#555; border-bottom:2px solid transparent; }
  .tab.active { color:#2F4858; border-bottom-color:#C9525E; background:#fff; }
  .subtabs { display:flex; gap:2px; padding:0 16px; background:#f4f5f7; border-bottom:1px solid #dde; }
  .subtab { padding:6px 14px; cursor:pointer; font-size:12px; color:#666; border-bottom:2px solid transparent; }
  .subtab:hover { color:#2F4858; }
  .subtab.active { color:#2F4858; border-bottom-color:#8aa4ab; background:#fff; font-weight:600; }
  .toolbar { display:flex; align-items:center; gap:8px; padding:10px 16px; background:#fff; border-bottom:1px solid #dde; flex-wrap:wrap; }
  .toolbar input[type=search] { padding:6px 10px; border:1px solid #ccc; border-radius:4px; width:240px; font-size:12px; }
  .toolbar select { padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:12px; }
  button.btn { padding:6px 12px; border:1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer; font-size:12px; }
  button.btn:hover { background:#f0f0f0; }
  button.btn.primary { background:#2F4858; color:#fff; border-color:#2F4858; }
  button.btn.primary:hover { background:#25394a; }
  .cols-panel, .filter-panel { position:fixed; z-index:200; background:#fff; border:1px solid #ccc; border-radius:6px; box-shadow:0 4px 16px rgba(0,0,0,.2); padding:10px; max-height:min(420px, 80vh); overflow:auto; width:260px; max-width:92vw; }
  .cols-panel label, .filter-panel label { display:flex; align-items:center; gap:6px; padding:3px 2px; font-size:12px; white-space:nowrap; cursor:pointer; }
  .filter-panel .fp-actions { display:flex; gap:6px; margin-top:8px; border-top:1px solid #eee; padding-top:8px; }
  .filter-panel input[type=text], .filter-panel input[type=number], .filter-panel select { width:100%; padding:4px 6px; margin-bottom:6px; border:1px solid #ccc; border-radius:4px; font-size:12px; }
  .fp-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .fp-header .fp-title { font-weight:600; font-size:12px; }
  .fp-close { cursor:pointer; font-size:18px; line-height:1; color:#888; padding:0 4px; }
  .fp-close:hover { color:#333; }
  .fp-mode-tabs { display:flex; gap:4px; margin-bottom:8px; }
  .fp-mode-tab { flex:1; padding:4px 6px; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:11px; text-align:center; background:#fff; }
  .fp-mode-tab.active { background:#2F4858; color:#fff; border-color:#2F4858; }
  .fp-select-all { border-bottom:1px solid #eee; padding-bottom:6px; margin-bottom:4px; font-weight:600; }
  .fp-condition-row { display:flex; gap:6px; align-items:center; }
  .fp-condition-row input { margin-bottom:0; }
  .table-wrap { overflow:auto; background:#fff; margin:0 16px 16px; border:1px solid #dde; border-radius:6px; max-height:calc(100vh - 190px); }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { padding:6px 10px; border-bottom:1px solid #eee; border-right:1px solid #f2f2f2; text-align:left; white-space:nowrap; }
  th { background:#f8f9fb; position:sticky; top:0; z-index:2; user-select:none; padding:0; }
  th:first-child, td:first-child { position:sticky; left:0; background:#fff; z-index:1; box-shadow:2px 0 3px rgba(0,0,0,.04); }
  th:first-child { z-index:3; background:#f8f9fb; }
  .th-inner { display:flex; align-items:center; gap:2px; padding:6px 4px 6px 10px; }
  .th-label { flex:1; cursor:pointer; min-width:0; }
  .sort-ind { color:#C9525E; margin-left:4px; }
  .filter-btn { flex-shrink:0; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:4px; cursor:pointer; color:#8a94a3; border:1px solid transparent; font-size:12px; background:none; }
  .filter-btn:hover { background:#e8eaee; color:#2F4858; }
  .filter-btn.active { color:#fff; background:#C9525E; border-color:#C9525E; }
  .filter-btn:focus-visible { outline:2px solid #2F4858; outline-offset:1px; }
  tr:hover td { background:#fafbfc; }
  tr:hover td:first-child { background:#f4f6f7; }
  .empty-cell { color:#bbb; }
  td.flagged { position:relative; }
  td.flagged::after { content:''; position:absolute; top:0; right:0; border-width:0 7px 7px 0; border-style:solid; border-color:transparent #d9822b transparent transparent; }
  .status-row { padding:6px 16px; font-size:11px; color:#666; background:#fff; }
  .qa-conflict { background:#fff3f0 !important; }
  .qa-quarantine { background:#fff8e1 !important; }
  .no-results-row td { text-align:center; padding:28px 16px; color:#888; font-size:13px; }
  .no-results-row .btn { margin-left:8px; }
  .card-btn { width:22px; height:22px; border-radius:4px; border:1px solid transparent; background:none; cursor:pointer; color:#8a94a3; font-size:12px; }
  .card-btn:hover { background:#e8eaee; color:#2F4858; }
  th.card-th { width:30px; text-align:center; }
  .source-card { width:340px; }
  .sc-row { font-size:12px; padding:5px 2px; border-bottom:1px solid #f2f2f2; line-height:1.4; }
  .sc-row b { color:#2F4858; display:block; font-size:11px; text-transform:uppercase; letter-spacing:.02em; margin-bottom:1px; }
  .qa-toggle { display:flex; align-items:center; gap:5px; font-size:12px; color:#555; cursor:pointer; padding:4px 8px; border:1px solid #ccc; border-radius:4px; background:#fff; }
  .qa-toggle input { cursor:pointer; }
  .segment-cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:12px; padding:14px 16px; background:#f4f5f7; }
  .seg-card { background:#fff; border:1px solid #dde; border-radius:8px; padding:14px; }
  .seg-card h3 { font-size:13px; margin-bottom:8px; color:#2F4858; }
  .seg-card .seg-row { font-size:12px; color:#555; margin-bottom:4px; }
  .seg-card .seg-row b { color:#1a1a1a; }
  .seg-card button { margin-top:10px; width:100%; }
</style>
</head>
<body>

<header>
  <h1>Кодификатор</h1>
  <span class="meta" id="metaLine"></span>
</header>

<div class="tabs" id="sectionTabs">
  <div class="tab" data-section="codifier">Общий кодификатор</div>
  <div class="tab" data-section="sale">Продажа офисов</div>
  <div class="tab" data-section="rent">Аренда офисов</div>
  <div class="tab" data-section="flex">Гибкие офисы</div>
  <div class="tab" id="compareSegmentsTab" data-section="compare" data-view="compare_segments">⇄ Сравнить сегменты</div>
</div>
<div class="subtabs" id="viewTabs" style="display:none;"></div>
<div class="segment-cards" id="segmentCards" style="display:none;"></div>

<div class="toolbar" id="toolbar">
  <input type="search" id="globalSearch" placeholder="Поиск по всей таблице...">
  <select id="quarterSelect" style="display:none;"></select>
  <select id="compareSelect" style="display:none;">
    <option value="">Без сравнения</option>
  </select>
  <select id="presetSelect">
    <option value="">Пресеты...</option>
    <option value="all_sale">Только сегмент «Продажа офисов»</option>
    <option value="under_construction">Строящиеся</option>
    <option value="delivered">Введённые</option>
    <option value="no_source">Без источника</option>
    <option value="changed_only">Только изменения</option>
  </select>
  <button class="btn" id="btnColumns">Колонки ▾</button>
  <button class="btn" id="btnReset">Сбросить фильтры</button>
  <label class="qa-toggle" title="Показывает технические/служебные поля (ID, raw-названия, QA-заметки и т.п.) — только для внутренней проверки">
    <input type="checkbox" id="qaModeToggle"> Режим QA (технические поля)
  </label>
  <button class="btn" id="btnCopyLink">Скопировать ссылку на вид</button>
  <button class="btn" id="btnExportCsv">Экспорт CSV</button>
  <button class="btn primary" id="btnExportXlsx">Экспорт XLSX</button>
</div>

<div class="status-row" id="statusRow"></div>
<div class="status-row" id="qaLegend">
  Подсветка строк: <span style="background:#fff3f0;padding:1px 6px;border-radius:3px;">конфликт источников</span>
  <span style="background:#fff8e1;padding:1px 6px;border-radius:3px;margin-left:6px;">на карантине/проверке</span>
  <span style="margin-left:6px;">— без цвета: проверено, конфликтов нет</span>
  <span style="margin-left:6px;">· уголок в ячейке (наведите) — спорный момент по этому полю</span>
</div>
<div class="status-row" id="totalsRow" style="font-weight:600;"></div>
<div class="table-wrap"><table id="mainTable"><thead></thead><tbody></tbody></table></div>
<div class="status-row" id="pagerRow" style="display:flex; align-items:center; gap:8px;">
  <button class="btn" id="btnPrevPage">← Пред.</button>
  <span id="pagerLabel"></span>
  <button class="btn" id="btnNextPage">След. →</button>
  <select id="pageSizeSelect" style="margin-left:auto;">
    <option value="50">50 строк/стр.</option>
    <option value="100" selected>100 строк/стр.</option>
    <option value="250">250 строк/стр.</option>
    <option value="1000">1000 строк/стр.</option>
  </select>
</div>

<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ============================================================
//  КВАРТАЛЫ
// ============================================================
const QUARTERS = [
  {id:'202606', label:'Q2 2026'}, {id:'202603', label:'Q1 2026'},
  {id:'202512', label:'Q4 2025'}, {id:'202509', label:'Q3 2025'},
  {id:'202506', label:'Q2 2025'}, {id:'202503', label:'Q1 2025'},
  {id:'202412', label:'Q4 2024'}, {id:'202410', label:'Q3 2024'},
  {id:'202407', label:'Q2 2024'}, {id:'202403', label:'Q1 2024'},
  {id:'202311', label:'Q4 2023'}, {id:'202308', label:'Q3 2023'},
  {id:'202305', label:'Q2 2023'}, {id:'202212', label:'Q4 2022'},
  {id:'202207', label:'Q2 2022'}, {id:'202112', label:'Q4 2021'},
  {id:'202105', label:'Q2 2021'},
];

function escapeHtml(s) {
  if (s == null) return s;
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fetchJSON(url) {
  return fetch(url, {cache:'no-cache'}).then(r => { if (!r.ok) throw new Error(url); return r.json(); });
}

// ============================================================
//  РАЗДЕЛЫ И ВКЛАДКИ
// ============================================================
// Верхний уровень навигации — 4 раздела + отдельный режим сравнения
// агрегатов. Сегмент рынка определяется ВЫБРАННЫМ РАЗДЕЛОМ, а не отдельным
// селектором (раньше «Все лоты» была одной вкладкой с выпадающим списком
// sale/rent/coworking, что и создавало ощущение смешения сегментов).
const SECTIONS = [
  {id:'codifier', label:'Общий кодификатор', views:['codifier']},
  {id:'sale',     label:'Продажа офисов',    views:['sale_buildings','sale_developers','sale_lots']},
  {id:'rent',     label:'Аренда офисов',     views:['rent_buildings','rent_landlords','rent_lots']},
  {id:'flex',     label:'Гибкие офисы',      views:['flex_operators','flex_lots']},
];
const VIEWS = {
  codifier:        {section:'codifier', label:'Общий кодификатор'},
  sale_buildings:  {section:'sale',     label:'Здания квартала'},
  sale_developers: {section:'sale',     label:'Девелоперы квартала'},
  sale_lots:       {section:'sale',     label:'Все лоты в продаже'},
  rent_buildings:  {section:'rent',     label:'Объекты квартала'},
  rent_landlords:  {section:'rent',     label:'Арендодатели/девелоперы'},
  rent_lots:       {section:'rent',     label:'Все предложения аренды'},
  flex_operators:  {section:'flex',     label:'Операторы и объекты'},
  flex_lots:       {section:'flex',     label:'Все гибкие предложения'},
  compare_segments:{section:'compare',  label:'Сравнение сегментов'},
};
// Пользовательское название — "Сегмент рынка" (не "Канал", технический
// market_channel наружу не показываем). Показывается в шапке/итогах/экспорте
// каждой таблицы — это не фильтр, а то, какой раздел/файл выбран.
const SEGMENT_LABEL = {codifier:null, sale:'Продажа офисов', rent:'Аренда офисов', flex:'Гибкие офисы', compare:null};
// ID проекта в данных хранится как "proj-1" и т.п. — в интерфейсе показываем
// только число, само значение canonical_project_id в данных не меняем
// (используется как есть для join/сопоставления, только отображение другое).
function PROJECT_ID_NUMBER(v) {
  const m = String(v).match(/-?(\d+)\s*$/);
  return m ? m[1] : v;
}
// Технические enum-значения из общего реестра — не показываем как есть,
// переводим в понятные бизнес-формулировки. Ключи — в исходном регистре
// ИЛИ в нижнем (сопоставление в translateValue() регистронезависимое), т.к.
// в разных QA-документах проекта одни и те же коды встречаются в обоих
// регистрах (например BLOCKED_BY_EVIDENCE в qa_handoff.json).
const MARKET_CHANNEL_DISPLAY = {
  sale: 'Продажа офисов', rent: 'Аренда офисов',
  coworking: 'Гибкие офисы (коворкинг)', serviced_office: 'Гибкие офисы (серв. офис)',
  other: 'Другое / не установлено',
};
const QA_STATUS_DISPLAY = {
  ok: 'Проверено', conflict: 'Конфликт источников',
  quarantine: 'На карантине (проверка)', historical_quarantine: 'Историческая запись на проверке',
  source_missing: 'Источник не указан', blocked_by_evidence: 'Требует подтверждения',
};
const VERIFICATION_STATUS_DISPLAY = {
  accepted: 'Принято', under_review: 'На проверке',
  blocked_by_evidence: 'Требует подтверждения', source_missing: 'Источник не указан',
};
const AREA_SCOPE_DISPLAY = {
  project: 'Проект', building: 'Здание', block: 'Корпус', phase: 'Фаза',
  unknown: 'Неизвестно', aggregate_only: 'Только агрегированные данные',
};
const GEOMETRY_QUALITY_DISPLAY = {
  geocoded_approx: 'Приблизительно (геокодирование)', house_exact: 'Точно (по дому)',
  unverified: 'Не проверено', unknown: 'Неизвестно',
};

// ============================================================
//  ОПРЕДЕЛЕНИЯ КОЛОНОК
// ============================================================
// Общий кодификатор — универсальные атрибуты проекта/здания. Специфические
// показатели лотов/аренды/коворкинга сюда НЕ добавляются как основные поля
// (они у себя в разделах Продажа/Аренда/Гибкие офисы); offer_status —
// статус предложения именно КАНАЛА ПРОДАЖИ — оставлен только справочно и
// скрыт по умолчанию, чтобы не путать с общим статусом проекта.
// internal:true — техническое/служебное поле: не показывается в обычном
// режиме вообще (ни в таблице, ни в панели "Колонки", ни в фильтрах,
// ни в экспорте), доступно только когда включён режим QA (см. qaMode
// ниже). Обычные скрытые-по-умолчанию поля (visible:false, без internal)
// остаются доступны всем через панель "Колонки" — это просто "свёрнутые",
// а не "запрещённые" колонки.
const CODIFIER_COLUMNS = [
  // ID и QA-статус/примечания — ядро смысла кодификатора (сквозная
  // идентификация + видимая проверка данных), не прячем их за режим QA:
  // internal:true оставлен только для действительно служебных полей ниже.
  {key:'canonical_project_id', label:'ID проекта', type:'text', visible:true, format: PROJECT_ID_NUMBER},
  {key:'canonical_name', label:'Проект', type:'text', visible:true},
  {key:'developer', label:'Девелопер', type:'text', visible:true},
  {key:'address', label:'Адрес', type:'text', visible:true},
  {key:'cls', label:'Класс', type:'text', visible:true},
  {key:'bizFormed', label:'Дел. район (сформ.)', type:'text', visible:false},
  {key:'bizForming', label:'Дел. район (форм.)', type:'text', visible:false},
  {key:'submarket', label:'Субрынок', type:'text', visible:true},
  {key:'zone', label:'Кольцо', type:'text', visible:true},
  {key:'project_status', label:'Статус проекта', type:'text', visible:true},
  {key:'input_year', label:'Год ввода', type:'number', visible:true},
  {key:'input_quarter', label:'Квартал ввода', type:'number', visible:true},
  {key:'input_date_kind', label:'Заявлено/подтверждено', type:'text', visible:false},
  // GLA — основная площадь (показывается первой, не пересчитывается из GBA:
  // если источник дал только GBA, GLA остаётся "нет данных", а не подменяется).
  // GBA — вторичная/справочная, скрыта по умолчанию, всегда после GLA.
  {key:'gla', label:'GLA, м²', type:'number', visible:true},
  {key:'gba', label:'GBA, м²', type:'number', visible:false},
  {key:'office_area', label:'GLA офисная (если указана отдельно), м²', type:'number', visible:false},
  {key:'area_scope', label:'Уровень площади', type:'text', visible:true, displayMap: AREA_SCOPE_DISPLAY},
  {key:'market_channel', label:'Сегменты рынка (справочно)', type:'list', visible:true, displayMap: MARKET_CHANNEL_DISPLAY},
  {key:'quarter_offer_exists', label:'Есть предложение в квартале', type:'bool', visible:false},
  {key:'offer_status', label:'Статус предложения', type:'text', visible:false},
  {key:'source', label:'Источник', type:'text', visible:true},
  {key:'last_verified_at', label:'Дата последней проверки', type:'text', visible:true},
  {key:'confidence', label:'Уровень доверия', type:'text', visible:true},
  {key:'qa_status', label:'Статус проверки', type:'text', visible:true, displayMap: QA_STATUS_DISPLAY},
  {key:'qa_notes', label:'Примечания', type:'text', visible:true},
  {key:'geometry_quality', label:'Точность координат', type:'text', visible:false, displayMap: GEOMETRY_QUALITY_DISPLAY},
  {key:'offer_not_started_reason', label:'Причина отсутствия предложения', type:'text', visible:false},
  {key:'latitude', label:'Широта', type:'number', visible:false},
  {key:'longitude', label:'Долгота', type:'number', visible:false},
  // --- технические/служебные поля — только в режиме QA ---
  {key:'canonical_building_id', label:'ID корпуса (техн.)', type:'text', visible:false, internal:true},
  {key:'raw_name', label:'Исходное название (техн.)', type:'text', visible:false, internal:true},
  {key:'aliases', label:'Альт. названия (техн.)', type:'list', visible:false, internal:true},
  {key:'external_only', label:'Только внешний источник (техн.)', type:'bool', visible:false, internal:true, boolTrueLabel:'Найдено только во внешнем источнике'},
  {key:'public_visibility', label:'Видимость (техн.)', type:'text', visible:false, internal:true},
  {key:'quarter_offer_refs', label:'Ссылки на квартальные записи (техн.)', type:'list', visible:false, internal:true},
  {key:'verification_status', label:'Статус верификации (техн.)', type:'text', visible:false, internal:true, displayMap: VERIFICATION_STATUS_DISPLAY},
  {key:'entity_grain', label:'Уровень записи (техн.)', type:'text', visible:false, internal:true},
  {key:'first_seen_at', label:'Впервые зафиксировано (техн.)', type:'text', visible:false, internal:true},
  {key:'source_count', label:'Число источников (техн.)', type:'number', visible:false, internal:true},
];

// --- Продажа офисов ---
const SALE_BUILDINGS_COLUMNS = [
  {key:'name', label:'Здание', type:'text', visible:true},
  {key:'name_orig', label:'Прежнее название', type:'text', visible:false},

async function loadCodifier() {

  allProjectsLayer = rows;
  state.codifier.rows = rows;
  dataMeta.codifier = {updated: rows.length ? rows[0].last_verified_at : null, count: rows.length};

// Join к общему реестру по имени/исходному имени — без изменения production-файлов,
// сопоставление делается здесь, на чтении.
function registryByNameMap() {
  const byName = new Map();
  for (const r of allProjectsLayer) {
    if (r.canonical_name) byName.set(r.canonical_name, r);
    if (r.raw_name) byName.set(r.raw_name, r);
  }
  return byName;
}
function joinRegistryFields(row, byName, nameKey, nameOrigKey) {
  const match = byName.get(row[nameKey]) || (nameOrigKey ? byName.get(row[nameOrigKey]) : null);
  row.canonical_project_id = match ? match.canonical_project_id : null;
  row.reg_project_status = match ? match.project_status : null;
  row.reg_offer_status = match ? match.offer_status : null;
  row.reg_input_quarter = match ? match.input_quarter : null;
  row.reg_source = match ? match.source : null;
  row.reg_confidence = match ? match.confidence : null;
  row.reg_bizFormed = match ? match.bizFormed : null;
  row.reg_bizForming = match ? match.bizForming : null;
  row.reg_market_channel = match ? match.market_channel : null;
  row.reg_developer = match ? match.developer : null;
  row.reg_cls = match ? match.cls : null;
  row.reg_zone = match ? match.zone : null;
  row.reg_submarket = match ? match.submarket : null;
  row.reg_gla = match ? match.gla : null;
  row.reg_gba = match ? match.gba : null;
  // Для цветовой подсветки конфликтов/карантина в разделах Продажа/Аренда/
  // Гибкие офисы — те же строки, что joined к реестру, должны подсвечиваться
  // так же, как в общем кодификаторе, а не только там (см. rowClass в render()).
  row.reg_qa_status = match ? match.qa_status : null;
  return match;
}

// data/building_dates.json — старт строительства/продаж/ввода по зданию,
// ключ = имя здания в нижнем регистре. Отдельный файл, не в реестре.
let buildingDatesCache = null;
async function loadBuildingDates() {
  if (buildingDatesCache) return buildingDatesCache;
  try { buildingDatesCache = await fetchJSON('data/building_dates.json'); }
  catch (e) { buildingDatesCache = {}; }
  return buildingDatesCache;
}
// "202503" -> "Q1 2025"
function formatQuarterId(q) {
  if (!q || String(q).length !== 6) return q;
  const y = String(q).slice(0, 4), m = String(q).slice(4, 6);
  const qtr = {'01':'Q1','02':'Q1','03':'Q1','04':'Q2','05':'Q2','06':'Q2','07':'Q3','08':'Q3','09':'Q3','10':'Q4','11':'Q4','12':'Q4'}[m] || m;
  return `${qtr} ${y}`;
}

async function fetchBuildingsWithJoin(quarterId) {
  const rows = await fetchJSON(`data/buildings_${quarterId}.json`);
  const byName = registryByNameMap();
  const dates = await loadBuildingDates();
  for (const row of rows) {
    joinRegistryFields(row, byName, 'name', 'name_orig');
    const bd = dates[String(row.name || '').toLowerCase()] || dates[String(row.name_orig || '').toLowerCase()];
    row.construction_start_q = bd ? formatQuarterId(bd.construction_start_q) : null;
    row.sales_start_q = bd ? formatQuarterId(bd.start_q) : null;
  }
  return rows;
}

async function loadSaleDevelopers(quarterId) {
  const buildings = await fetchBuildingsWithJoin(quarterId);
  const byDev = new Map();
  for (const b of buildings) {
    const dev = b.developer || '—';
    if (!byDev.has(dev)) {
      byDev.set(dev, {developer: dev, projectIds: new Set(), buildings: 0, glaSum: 0, glaCount: 0, gbaSum: 0, volumeSum: 0, lotsSum: 0, priceWeighted: 0, classes: new Set()});
    }
    const acc = byDev.get(dev);
    acc.projectIds.add(b.canonical_project_id || b.name);
    acc.buildings += 1;
    if (b.gla != null) { acc.glaSum += Number(b.gla); acc.glaCount += 1; }
    if (b.gba != null) acc.gbaSum += Number(b.gba);
    if (b.volume != null) acc.volumeSum += Number(b.volume);
    if (b.lots != null) acc.lotsSum += Number(b.lots);
    if (b.price != null && b.volume != null) acc.priceWeighted += Number(b.price) * Number(b.volume);
    if (b.cls) acc.classes.add(b.cls);
  }
  const rows = [...byDev.values()].map(acc => ({
    developer: acc.developer,
    projects: acc.projectIds.size,
    buildings: acc.buildings,
    // GLA — основная площадь: сумма только там, где GLA реально известна по
    // зданию (glaCount из acc.buildings), не подставляем GBA вместо пропуска.
    glaSum: acc.glaSum || null,
    glaKnownBuildings: acc.glaCount,
    gbaSum: acc.gbaSum || null,
    volumeSum: acc.volumeSum || null,
    lotsSum: acc.lotsSum || null,
    weightedPrice: acc.volumeSum ? Math.round(acc.priceWeighted / acc.volumeSum) : null,
    classes: [...acc.classes].sort().join(', '),
  }));
  state.sale_developers.rows = rows;
  if (!suppressURLSync) state.sale_developers.page = 1;
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.sale_developers = {updated: label, count: rows.length};
  render();
}

async function loadSaleLots(quarterId) {
  let rows;
  try {
    const raw = await fetchJSON(`data/lots_${quarterId}.json`);
    rows = [];
    for (const [building, lotRows] of Object.entries(raw)) {
      for (const lot of lotRows) rows.push({building, ...lot});
    }
  } catch (e) {
    rows = []; // не у каждого квартала есть файл — пустая таблица, не ошибка
  }
  const byName = registryByNameMap();
  for (const row of rows) {
    row.market_channel = SEGMENT_LABEL.sale; // явное, константное поле — вся вкладка = один сегмент рынка
    joinRegistryFields(row, byName, 'building', null);
  }
  state.sale_lots.rows = rows;
  if (!suppressURLSync) { state.sale_lots.filters = {}; state.sale_lots.sort = {key:null, dir:1}; state.sale_lots.page = 1; }
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.sale_lots = {updated: label, count: rows.length};
  render();
}

async function loadRentBuildings(quarterId) {
  const raw = await fetchRentLotsRaw(quarterId);
  const byName = registryByNameMap();
  const byBuilding = new Map();
  for (const [building, lotRows] of Object.entries(raw)) {
    const match = byName.get(building);
    if (!byBuilding.has(building)) {
      byBuilding.set(building, {
        building, developer: match ? match.developer : null, cls: match ? match.cls : null,
        zone: match ? match.zone : null, submarket: match ? match.submarket : null,
        canonical_project_id: match ? match.canonical_project_id : null,
        reg_source: match ? match.source : null,
        // GLA/GBA здания — атрибут самого здания (из реестра), не сумма по
        // лотам аренды: площадь предложений аренды (areaSum ниже) — отдельная
        // величина, её нельзя путать с GLA здания (п.5 задачи).
        reg_gla: match ? match.gla : null, reg_gba: match ? match.gba : null,
        lotsCount: 0, areaSum: 0, rateWeighted: 0,
      });
    }
    const acc = byBuilding.get(building);
    for (const lot of lotRows) {
      acc.lotsCount += 1;
      if (lot.area != null) acc.areaSum += Number(lot.area);
      if (lot.rate != null && lot.area != null) acc.rateWeighted += Number(lot.rate) * Number(lot.area);
    }
  }
  const rows = [...byBuilding.values()].map(acc => ({
    building: acc.building, developer: acc.developer, cls: acc.cls, zone: acc.zone, submarket: acc.submarket,
    canonical_project_id: acc.canonical_project_id, reg_source: acc.reg_source,
    reg_gla: acc.reg_gla, reg_gba: acc.reg_gba,
    lotsCount: acc.lotsCount || null,
    areaSum: acc.areaSum || null,
    weightedRate: acc.areaSum ? Math.round(acc.rateWeighted / acc.areaSum) : null,
  }));
  state.rent_buildings.rows = rows;
  if (!suppressURLSync) state.rent_buildings.page = 1;
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.rent_buildings = {updated: label, count: rows.length};
  render();
}

async function loadRentLandlords(quarterId) {
  const raw = await fetchRentLotsRaw(quarterId);
  const byName = registryByNameMap();
  const byDev = new Map();
  for (const [building, lotRows] of Object.entries(raw)) {
    const match = byName.get(building);
    const dev = match && match.developer ? match.developer : '—';
    if (!byDev.has(dev)) byDev.set(dev, {developer: dev, buildingSet: new Set(), lotsCount: 0, areaSum: 0, rateWeighted: 0});
    const acc = byDev.get(dev);
    acc.buildingSet.add(building);
    for (const lot of lotRows) {
      acc.lotsCount += 1;
      if (lot.area != null) acc.areaSum += Number(lot.area);
      if (lot.rate != null && lot.area != null) acc.rateWeighted += Number(lot.rate) * Number(lot.area);
    }
  }
  const rows = [...byDev.values()].map(acc => ({
    developer: acc.developer, objects: acc.buildingSet.size, lotsCount: acc.lotsCount || null,
    areaSum: acc.areaSum || null,
    weightedRate: acc.areaSum ? Math.round(acc.rateWeighted / acc.areaSum) : null,
  }));
  state.rent_landlords.rows = rows;
  if (!suppressURLSync) state.rent_landlords.page = 1;
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.rent_landlords = {updated: label, count: rows.length};
  render();
}

async function loadRentLots(quarterId) {
  const raw = await fetchRentLotsRaw(quarterId);
  const rows = [];
  for (const [building, lotRows] of Object.entries(raw)) {
    for (const lot of lotRows) rows.push({building, ...lot});
  }
  const byName = registryByNameMap();
  for (const row of rows) {
    row.market_channel = SEGMENT_LABEL.rent;
    joinRegistryFields(row, byName, 'building', null);
  }
  state.rent_lots.rows = rows;
  if (!suppressURLSync) { state.rent_lots.filters = {}; state.rent_lots.sort = {key:null, dir:1}; state.rent_lots.page = 1; }
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.rent_lots = {updated: label, count: rows.length};
  render();
}

// --- Гибкие офисы ---
async function fetchFlexRowsRaw(quarterId) {
  const rows = [];
  for (const [flexType, filePrefix] of Object.entries(FLEX_FILE_BY_TYPE)) {
    let raw;
    try { raw = await fetchJSON(`data/${filePrefix}_${quarterId}.json`); } catch (e) { raw = []; }
    for (const r of raw) rows.push({...r, flex_type: FLEX_TYPE_LABEL[flexType] || flexType});
  }
  return rows;
}

async function loadFlexOperators(quarterId) {
  const raw = await fetchFlexRowsRaw(quarterId);
  const byOperator = new Map();
  for (const r of raw) {
    const op = r.network || '—';
    if (!byOperator.has(op)) byOperator.set(op, {network: op, objectSet: new Set(), types: new Set(), seatsSum: 0, vacancySum: 0, rateWeighted: 0, seatsForRate: 0});
    const acc = byOperator.get(op);
    acc.objectSet.add(r.bc || r.name);
    acc.types.add(r.flex_type);
    if (r.seats != null) acc.seatsSum += Number(r.seats);
    if (r.vacancy != null) acc.vacancySum += Number(r.vacancy);
    if (r.rate != null && r.seats != null) { acc.rateWeighted += Number(r.rate) * Number(r.seats); acc.seatsForRate += Number(r.seats); }
  }
  const rows = [...byOperator.values()].map(acc => ({
    network: acc.network, objectsCount: acc.objectSet.size, types: [...acc.types].sort().join(', '),
    seatsSum: acc.seatsSum || null, vacancySum: acc.vacancySum || null,
    weightedRate: acc.seatsForRate ? Math.round(acc.rateWeighted / acc.seatsForRate) : null,
  }));
  state.flex_operators.rows = rows;
  if (!suppressURLSync) state.flex_operators.page = 1;
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.flex_operators = {updated: label, count: rows.length};
  render();
}

async function loadFlexLots(quarterId) {

  const byName = registryByNameMap();
  for (const row of rows) joinRegistryFields(row, byName, 'name', null);
  state.flex_lots.rows = rows;
  if (!suppressURLSync) { state.flex_lots.filters = {}; state.flex_lots.sort = {key:null, dir:1}; state.flex_lots.page = 1; }
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.flex_lots = {updated: label, count: rows.length};

}

// --- Сравнение сегментов ---
// Лёгкие агрегаты-KPI по трём сегментам для режима "Сравнить сегменты" и
// для карточек на стартовом экране кодификатора. Формулы средневзвешенных
// — те же самые, что уже используются в loadRentBuildings/computeTotals
// (sum(rate*area)/sum(area) и т.п.), просто без побочных эффектов на
// детальные state[view].rows — здесь не расчёты меняются, а способ их
// применить, чтобы посчитать сводку без полной загрузки детальных таблиц.
async function computeSegmentKPIs(quarterId) {
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;

  let saleRaw = {};
  try { saleRaw = await fetchJSON(`data/lots_${quarterId}.json`); } catch (e) {}
  let saleObjects = 0, saleLots = 0, saleArea = 0, saleTotal = 0;
  for (const lotRows of Object.values(saleRaw)) {
    saleObjects += 1;
    for (const lot of lotRows) {
      saleLots += 1;
      if (lot.area != null) saleArea += Number(lot.area);
      if (lot.total != null) saleTotal += Number(lot.total);
    }
  }

  const rentRaw = await fetchRentLotsRaw(quarterId);
  let rentObjects = 0, rentLots = 0, rentArea = 0, rentRateWeighted = 0;
  for (const lotRows of Object.values(rentRaw)) {
    rentObjects += 1;
    for (const lot of lotRows) {
      rentLots += 1;
      if (lot.area != null) rentArea += Number(lot.area);
      if (lot.rate != null && lot.area != null) rentRateWeighted += Number(lot.rate) * Number(lot.area);
    }
  }

  const flexRaw = await fetchFlexRowsRaw(quarterId);
  let flexSeats = 0, flexRateWeighted = 0, flexSeatsForRate = 0;
  for (const r of flexRaw) {
    if (r.seats != null) flexSeats += Number(r.seats);
    if (r.rate != null && r.seats != null) { flexRateWeighted += Number(r.rate) * Number(r.seats); flexSeatsForRate += Number(r.seats); }
  }

  return {
    sale: {segment: SEGMENT_LABEL.sale, objects: saleObjects, volumeLabel:'Площадь, м²', volume: saleArea || null,
           lotsCount: saleLots, rateLabel:'Цена (ср.взв.), руб/м²', rate: saleArea ? Math.round(saleTotal / saleArea) : null, updated: label},
    rent: {segment: SEGMENT_LABEL.rent, objects: rentObjects, volumeLabel:'Площадь, м²', volume: rentArea || null,
           lotsCount: rentLots, rateLabel:'Ставка (ср.взв.), руб/м²/год', rate: rentArea ? Math.round(rentRateWeighted / rentArea) : null, updated: label},
    flex: {segment: SEGMENT_LABEL.flex, objects: flexRaw.length, volumeLabel:'Мест, всего', volume: flexSeats || null,
           lotsCount: flexRaw.length, rateLabel:'Ставка (ср.взв.), руб/мес', rate: flexSeatsForRate ? Math.round(flexRateWeighted / flexSeatsForRate) : null, updated: label},
  };
}

async function loadCompareSegments(quarterId) {
  const kpi = await computeSegmentKPIs(quarterId);
  state.compare_segments.rows = [kpi.sale, kpi.rent, kpi.flex];
  if (!suppressURLSync) state.compare_segments.page = 1;
  const label = QUARTERS.find(q => q.id === quarterId)?.label || quarterId;
  dataMeta.compare_segments = {updated: label, count: 3};
  render();
}

// ============================================================
//  ФИЛЬТРАЦИЯ / СОРТИРОВКА
// ============================================================
// Технические enum-значения (market_channel и т.п.) переводятся в
// пользовательские подписи через col.displayMap — единая точка перевода
// для отображения, сортировки, фильтра и экспорта одной и той же колонки.
// Регистронезависимо: одни и те же технические коды встречаются в проекте
// в разных регистрах (например BLOCKED_BY_EVIDENCE в одних QA-документах,
// blocked_by_evidence в других).
function translateValue(col, v) {
  if (v == null || v === '' || !col.displayMap) return v;
  return col.displayMap[v] ?? col.displayMap[String(v).toLowerCase()] ?? v;
}
function listDisplayValues(row, col) {
  const raw = row[col.key];
  if (!Array.isArray(raw)) return [];
  return raw.map(v => String(translateValue(col, v)));
}

// Уголок на ячейке = спорный/сомнительный момент, найденный при проверке.
// title на ячейке — причина, при наведении.
function cellFlag(row, col) {
  const qa = row.qa_status || row.reg_qa_status;
  if (col.key === 'qa_status' && qa === 'conflict') return 'Конфликт источников — запись требует проверки.';
  if (col.key === 'qa_status' && qa === 'quarantine') return 'Запись на карантине, не подтверждена окончательно.';
  if ((col.key === 'gla' || col.key === 'reg_gla') && row[col.key] == null && (row.gba != null || row.reg_gba != null)) {
    return 'GLA не указана, доступна только GBA — не использовать GBA как замену GLA.';
  }
  if (col.key === 'canonical_name' && qa === 'conflict') return 'Конфликт источников по этой записи — см. карточку источника (ℹ).';
  if (col.key === 'offer_not_started_reason' && row.offer_not_started_reason) return 'Причина отсутствия предложения указана — проверить актуальность.';
  return null;
}

function cellValue(row, col) {
  let v = row[col.key];
  if (col.type === 'list' && Array.isArray(v)) return listDisplayValues(row, col).join(', ');
  if (col.type === 'bool') return v === true ? (col.boolTrueLabel || 'да') : (v === false ? (col.boolFalseLabel || 'нет') : '');
  v = translateValue(col, v);
  // Отображение-only форматирование (например, ID проекта "proj-1" -> "1")
  // — не трогает исходное значение в данных, применяется только здесь, а
  // значит одинаково и в ячейке, и в сортировке, и в фильтре, и в экспорте.
  if (col.format && v != null && v !== '') v = col.format(v);
  return v;
}

function passesCondition(row, col, cond) {
  if (!cond || !cond.op) return true;
  const raw = cellValue(row, col);
  if (col.type === 'number') {
    if (raw == null || raw === '') return false;
    const n = Number(raw);
    if (cond.op === 'eq') return cond.value !== '' && n === Number(cond.value);
    if (cond.op === 'gt') return cond.value !== '' && n > Number(cond.value);
    if (cond.op === 'lt') return cond.value !== '' && n < Number(cond.value);
    if (cond.op === 'between') {
      const lo = cond.value === '' ? -Infinity : Number(cond.value);
      const hi = cond.value2 === '' ? Infinity : Number(cond.value2);
      return n >= lo && n <= hi;
    }
    return true;
  }
  // текстовые операторы
  const s = String(raw ?? '').toLowerCase();
  const needle = String(cond.value ?? '').toLowerCase();
  if (needle === '') return true;
  if (cond.op === 'eq') return s === needle;
  if (cond.op === 'contains') return s.includes(needle);
  if (cond.op === 'startswith') return s.startsWith(needle);
  return true;
}

function passesFilter(row, col, filter) {
  if (!filter) return true;
  const raw = row[col.key];
  const isEmpty = raw == null || raw === '' || (Array.isArray(raw) && raw.length === 0);
  if (filter.emptyOnly) return isEmpty;
  if (filter.nonEmptyOnly) return !isEmpty;
  if (filter.mode === 'condition' && filter.condition) {
    return passesCondition(row, col, filter.condition);
  }
  if (filter.values && filter.values.size > 0) {
    // Для колонок-списков — "содержит хотя бы одно выбранное значение", а не
    // сравнение со всей склеенной строкой целиком. Сравниваем по тем же
    // переведённым подписям, что показаны в панели фильтра (listDisplayValues).
    if (col.type === 'list' && Array.isArray(raw)) {
      return listDisplayValues(row, col).some(v => filter.values.has(v));
    }
    const v = String(cellValue(row, col) ?? '');
    return filter.values.has(v);
  }
  return true;
}

function getFilteredSortedRows(ts) {
  let rows = ts.rows.filter(row => {
    for (const col of ts.columns) {
      const f = ts.filters[col.key];
      if (f && !passesFilter(row, col, f)) return false;
    }
    if (ts.globalSearch) {
      const q = ts.globalSearch.toLowerCase();
      const hit = ts.columns.some(col => {
        if (!isColumnShown(col)) return false;
        const v = cellValue(row, col);
        return v != null && String(v).toLowerCase().includes(q);
      });
      if (!hit) return false;
    }
    return true;
  });
  if (ts.sort.key) {
    const col = ts.columns.find(c => c.key === ts.sort.key);
    rows = rows.slice().sort((a, b) => {
      let av = cellValue(a, col), bv = cellValue(b, col);
      if (col.type === 'number') {
        av = av == null ? -Infinity : Number(av);
        bv = bv == null ? -Infinity : Number(bv);
        return (av - bv) * ts.sort.dir;
      }
      av = (av ?? '').toString().toLowerCase();
      bv = (bv ?? '').toString().toLowerCase();
      return av.localeCompare(bv, 'ru') * ts.sort.dir;
    });
  }
  return rows;
}

// ============================================================
//  РЕНДЕР
// ============================================================
// Итоги считаются по ПОЛНОЙ отфильтрованной выборке (не по текущей странице
// пагинации). Пустые значения не превращаются в 0.
function fmtNum(n) {
  if (n == null || !isFinite(n)) return '—';
  return Math.round(n).toLocaleString('ru-RU');
}
function sumField(rows, key) {
  let sum = 0, n = 0;
  for (const r of rows) { const v = r[key]; if (v != null && isFinite(v)) { sum += Number(v); n++; } }
  return {sum, n};
}
// Отдельно от fmtNum: если ни у одной строки значение не известно (n===0),
// пишем "нет данных", а не "0" — ноль означал бы, что площадь действительно
// нулевая, а не то, что источник её просто не дал (п.8 задачи).
function fmtSum(agg) {
  return agg.n === 0 ? 'нет данных' : fmtNum(agg.sum);
}
function uniqueCount(rows, keyFn) {
  return new Set(rows.map(keyFn).filter(v => v != null)).size;
}

// Итоги каждого раздела считаются только по его собственному сегменту рынка
// (rows всегда приходят из ОДНОГО файла-источника этого view — см. загрузку
// выше), и каждая непустая формула начинается с явной метки сегмента.
function computeTotals(view, rows) {
  const section = VIEWS[view].section;
  const segmentLabel = SEGMENT_LABEL[section];
  const prefix = segmentLabel ? `${segmentLabel} · ` : '';
  if (view === 'codifier') {
    const projects = uniqueCount(rows, r => r.canonical_project_id);
    // GLA — основная площадь, считается первой. area_scope='building' —
    // корпуса ВНУТРИ проекта, который уже посчитан на уровне 'project';
    // складывать их с проектными GLA нельзя (задвоение), поэтому считаем
    // раздельно по уровню агрегации (п.3: "не суммировать одновременно
    // GLA корпуса и GLA проекта").
    const projectRows = rows.filter(r => (r.area_scope || 'project') !== 'building');
    const buildingRows = rows.filter(r => r.area_scope === 'building');
    const glaProject = sumField(projectRows, 'gla');
    const glaBuilding = sumField(buildingRows, 'gla');
    const gba = sumField(rows, 'gba');
    return `Уникальных проектов: ${fmtNum(projects)} · Записей: ${rows.length} · `
      + `GLA проектов (сумма по ${glaProject.n} из ${projectRows.length}): ${fmtSum(glaProject)} м²`
      + (buildingRows.length ? ` · GLA отдельных корпусов (сумма по ${glaBuilding.n} из ${buildingRows.length}, НЕ входит в сумму выше): ${fmtSum(glaBuilding)} м²` : '')
      + ` · GBA (справочно, сумма по ${gba.n} из ${rows.length}): ${fmtSum(gba)} м²`;
  }
  if (view === 'sale_buildings') {
    const projects = uniqueCount(rows, r => r.canonical_project_id || r.name);
    const gla = sumField(rows, 'gla');
    const gba = sumField(rows, 'gba');
    const volume = sumField(rows, 'volume');
    const lots = sumField(rows, 'lots');
    const priceRows = rows.filter(r => r.price != null && r.volume != null);
    const weighted = priceRows.length ? priceRows.reduce((s,r)=>s+r.price*r.volume,0) / priceRows.reduce((s,r)=>s+r.volume,0) : null;
    return prefix + `Уникальных проектов: ${fmtNum(projects)} · Зданий: ${rows.length} · Лотов (сумма): ${fmtNum(lots.sum)} · `
      + `GLA зданий (сумма по ${gla.n} из ${rows.length}): ${fmtSum(gla)} м² · GBA (справочно): ${fmtSum(gba)} м² · `
      + `Площадь лотов в продаже (сумма): ${fmtNum(volume.sum)} м² · Ср.взв. цена: ${fmtNum(weighted)}`;
  }
  if (view === 'sale_developers') {
    const gla = sumField(rows, 'glaSum');
    const gba = sumField(rows, 'gbaSum');
    const volume = sumField(rows, 'volumeSum');
    const lots = sumField(rows, 'lotsSum');
    return prefix + `Девелоперов: ${rows.length} · GLA зданий (сумма): ${fmtSum(gla)} м² · GBA (справочно): ${fmtSum(gba)} м² · `
      + `Площадь лотов в продаже (сумма): ${fmtNum(volume.sum)} м² · Лотов (сумма): ${fmtNum(lots.sum)}`;
  }
  if (view === 'sale_lots') {
    const buildings = uniqueCount(rows, r => r.building);
    const area = sumField(rows, 'area');
    const total = sumField(rows, 'total');
    const weighted = total.sum && area.sum ? total.sum / area.sum : null;
    return prefix + `Лотов: ${rows.length} · Зданий (уникальных): ${buildings} · Площадь лотов (сумма): ${fmtNum(area.sum)} м² · `
      + `Стоимость (сумма): ${fmtNum(total.sum)} · Ср.взв. цена: ${fmtNum(weighted)}`;
  }
  if (view === 'rent_buildings') {
    const gla = sumField(rows, 'reg_gla');
    const gba = sumField(rows, 'reg_gba');
    const lots = sumField(rows, 'lotsCount');
    const area = sumField(rows, 'areaSum');
    return prefix + `Объектов: ${rows.length} · GLA зданий (сумма по ${gla.n} из ${rows.length}): ${fmtSum(gla)} м² · GBA (справочно): ${fmtSum(gba)} м² · `
      + `Предложений (сумма): ${fmtNum(lots.sum)} · Площадь предложений аренды (сумма): ${fmtNum(area.sum)} м²`;
  }
  if (view === 'rent_landlords') {
    const objects = sumField(rows, 'objects');
    const lots = sumField(rows, 'lotsCount');
    const area = sumField(rows, 'areaSum');
    return prefix + `Арендодателей: ${rows.length} · Объектов (сумма): ${fmtNum(objects.sum)} · Предложений (сумма): ${fmtNum(lots.sum)} · Площадь предложений аренды (сумма): ${fmtNum(area.sum)} м²`;
  }
  if (view === 'rent_lots') {
    const buildings = uniqueCount(rows, r => r.building);
    const area = sumField(rows, 'area');
    const rateRows = rows.filter(r => r.rate != null && r.area != null);
    const weighted = rateRows.length ? rateRows.reduce((s,r)=>s+r.rate*r.area,0) / rateRows.reduce((s,r)=>s+r.area,0) : null;
    return prefix + `Предложений: ${rows.length} · Объектов (уникальных): ${buildings} · Площадь предложений аренды (сумма): ${fmtNum(area.sum)} м² · Ср.взв. ставка: ${fmtNum(weighted)}`;
  }
  if (view === 'flex_operators') {
    const seats = sumField(rows, 'seatsSum');
    const vacancy = sumField(rows, 'vacancySum');
    return prefix + `Операторов: ${rows.length} · Рабочих мест (сумма): ${fmtNum(seats.sum)} · Свободно (сумма): ${fmtNum(vacancy.sum)} · Площадь гибкого предложения: нет данных в источнике`;
  }
  if (view === 'flex_lots') {
    const gla = sumField(rows, 'reg_gla');
    const area = sumField(rows, 'flex_area');
    const seats = sumField(rows, 'seats');
    const vacancy = sumField(rows, 'vacancy');
    return prefix + `Объектов: ${rows.length} · GLA объектов (реестр, сумма по ${gla.n} из ${rows.length}): ${fmtSum(gla)} м² · `
      + `Площадь гибкого предложения (сумма по ${area.n} из ${rows.length}): ${fmtSum(area)} м² · `
      + `Рабочих мест (сумма): ${fmtNum(seats.sum)} · Свободно (сумма): ${fmtNum(vacancy.sum)}`;
  }
  if (view === 'compare_segments') {
    return `Сегментов: ${rows.length} · сравнение агрегатов/KPI, без детальных строк лотов/зданий`;
  }
  return '';
}

  codifier: () => 'data/all_projects_layer.json',
  sale_buildings: () => `data/buildings_${currentQuarterId}.json (+ join по реестру)`,
  sale_developers: () => `data/buildings_${currentQuarterId}.json (агрегат по девелоперам)`,
  sale_lots: () => `data/lots_${currentQuarterId}.json`,
  rent_buildings: () => `data/rent_lots_${currentQuarterId}.json (агрегат по объектам)`,
  rent_landlords: () => `data/rent_lots_${currentQuarterId}.json (агрегат по арендодателям)`,
  rent_lots: () => `data/rent_lots_${currentQuarterId}.json`,
  flex_operators: () => `data/coworking_${currentQuarterId}.json (агрегат по операторам)`,
  flex_lots: () => `data/coworking_${currentQuarterId}.json`,
