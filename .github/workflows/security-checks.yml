name: Security checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Scan tracked files for secrets / raw sources
        run: python scripts/scan_secrets.py
      - name: Build public site
        run: python scripts/build_public_site.py
      - name: Verify raw sources / SECURITY_AUDIT.md are absent from public build
        run: |
          set -e
          # classifier.html and QA .md/.json docs are intentionally public
          # (2026-07-30, explicit request) — only raw source files, scripts,
          # and the security-findings doc itself must never appear in _site/.
          fail=0
          if find _site -name "SECURITY_AUDIT.md" | grep -q .; then
            echo "FAIL: SECURITY_AUDIT.md found in public build artifact"
            fail=1
          fi
          if find _site -iname "*.xlsx" -o -iname "*.gpkg" -o -iname "*.bat" | grep -q .; then
            echo "FAIL: raw source or script file found in public build artifact"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK: no raw sources / SECURITY_AUDIT.md in _site/"
